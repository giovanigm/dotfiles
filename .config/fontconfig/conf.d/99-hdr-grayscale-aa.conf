<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Grayscale antialiasing: LCD subpixel fringes break under Hyprland's
       HDR color-management pipeline (fuzzy/shimmering text on bright
       backgrounds). Takes effect for newly launched apps.
       Deployed as a single file into the Home-Manager-owned
       ~/.config/fontconfig/conf.d (see Makefile fontconfig special case). -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>
