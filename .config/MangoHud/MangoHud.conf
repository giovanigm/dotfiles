# MangoHud.conf — RTX 3080 / Hyprland (MangoHud 0.8.3)
# Overlay starts hidden; Shift_R+F9 shows/hides it (game window must be focused).
# Edit then press Shift_L+F4 (default reload_cfg) to reload live.

no_display=1
toggle_hud=Shift_R+F9

position=top-right
font_size=22
background_alpha=0.45
table_columns=3

fps
frametime
gpu_stats
cpu_stats
gpu_temp
cpu_temp
gpu_power
vram
ram
